# =============================================================================
# Dompet Harian — automatic Android APK build
# Runs on every push to main and on manual dispatch.
# Produces dompet-harian-v1.0.apk as a build artifact AND as a
# GitHub Release when the push carries a tag (v1.0.<run_number>).
# The native android/ folder is generated in CI and never committed.
# =============================================================================

name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Dompet Harian APK (Capacitor v6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 is NOT used — it tries to
      # install the legacy 'tools' package which no longer exists in the
      # SDK repository, so sdkmanager fails. Use the Android SDK
      # preinstalled on the ubuntu-latest runner instead.
      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already exists — skipping cap add."
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Generate Android icons & splash screens
        run: npx capacitor-assets generate --android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dompet-harian-v1.0.apk
          ls -lh dompet-harian-v1.0.apk

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dompet-harian-v1.0
          path: dompet-harian-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dompet Harian v1.0.${{ github.run_number }}
          body: |
            Dompet Harian — aplikasi pencatat pengeluaran harian (offline) v1.0.${{ github.run_number }}

            - 100% offline, single-file engine — saldo multi-dompet, anggaran harian/bulanan, target nabung, utang/piutang, transaksi berulang, arsip bulanan
            - Install: download APK di bawah ini lalu pasang langsung di HP Android.
          files: dompet-harian-v1.0.apk
          draft: false
          prerelease: false
